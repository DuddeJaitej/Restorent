<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="cartHeader"><a class="siteBrand" href="Restaurant.html">Rest0renT</a></header>
    <main class="cartPage">
        <div class="cartTitle"><p class="eyebrow">ORDER SUMMARY</p><h1>Your Cart</h1></div>
        <div id="cartItems"></div>
        <div class="cartFooter">
            <p class="total">Total Price: <strong><span id="totalPrice">0</span>/-</strong></p>
            <div class="cartActions">
                <button class="BackToItems" onclick="location.href='Items.html'">Add more Items</button>
                <button class="orderPlaced" onclick="location.href='OrderPlaced.html'">Order Now</button>
            </div>
        </div>
    </main>

    <script>
        function displayCart() {
            const cartData = localStorage.getItem('cart');
            let totalPrice = 0;

            if (cartData) {
                const cart = JSON.parse(cartData);
                const cartItemsContainer = document.getElementById('cartItems');
                cartItemsContainer.innerHTML = '';

                cart.forEach((item, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.innerHTML = `
                        <div class="itemsStyle">
                            <div class="cartImage"><img src="${item.image}" alt="${item.name}"></div>
                            <div class="itemDetails"><span>${item.name}</span><strong>${item.price}/-</strong></div>
                            <button onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    `;
                    cartItemsContainer.appendChild(itemDiv);
                    totalPrice += item.price;
                });

                document.getElementById('totalPrice').innerText = totalPrice;
            }
        }

        function removeFromCart(index) {
            const cartData = localStorage.getItem('cart');
            if (cartData) {
                let cart = JSON.parse(cartData);

                cart.splice(index, 1);

                localStorage.setItem('cart', JSON.stringify(cart));

                displayCart();
            }
        }

        window.onload = displayCart;
    </script>
    <script src="responsive.js"></script>
</body>
</html>
